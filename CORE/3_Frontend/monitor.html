<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Candle Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 10px;
      padding: 20px 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      color: #667eea;
      margin-bottom: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f8f9fa;
      border-radius: 20px;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #28a745;
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background: #dc3545;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .symbol {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timeframe {
      font-size: 14px;
      font-weight: 600;
      color: #999;
      background: #f0f0f0;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .timestamp {
      font-size: 12px;
      color: #999;
    }

    .price-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .price-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .price-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .price-value {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .price-value.up {
      color: #28a745;
    }

    .price-value.down {
      color: #dc3545;
    }

    .volume {
      margin-top: 15px;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      color: white;
    }

    .volume-label {
      font-size: 11px;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .volume-value {
      font-size: 20px;
      font-weight: bold;
    }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 10px;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 22px;
      }

      .status {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Real-Time Candle Monitor</h1>
      <div class="status">
        <div class="status-item">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Connecting...</span>
        </div>
        <div class="status-item">
          <span>⏱️ Last Update: <strong id="lastUpdate">Never</strong></span>
        </div>
        <div class="status-item">
          <span>📈 Symbols: <strong id="symbolCount">0</strong></span>
        </div>
      </div>
    </div>

    <div class="cards" id="cardsContainer">
      <div class="loading">⏳ Waiting for data...</div>
    </div>
  </div>

  <script>
    let eventSource = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;

    function connectSSE() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      eventSource = new EventSource('/events');

      let lastUpdateTime = null;
      let updateCheckInterval = null;

      eventSource.onopen = () => {
        console.log('✅ SSE Connected');
        statusDot.classList.remove('disconnected');
        statusText.textContent = 'Waiting for data...';
        reconnectAttempts = 0;

        // Проверяем обновления каждую секунду
        if (updateCheckInterval) clearInterval(updateCheckInterval);
        updateCheckInterval = setInterval(() => {
          if (lastUpdateTime) {
            const timeSinceUpdate = Date.now() - lastUpdateTime;
            if (timeSinceUpdate > 3000) {
              // Более 3 секунд без обновлений
              statusText.textContent = 'disconnected';
              statusDot.classList.add('disconnected');
            } else {
              statusText.textContent = 'connected';
              statusDot.classList.remove('disconnected');
            }
          }
        }, 1000);
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          lastUpdateTime = Date.now();
          statusText.textContent = 'connected';
          statusDot.classList.remove('disconnected');
          updateDisplay(data);
        } catch (error) {
          console.error('Error parsing SSE data:', error);
        }
      };

      eventSource.onerror = (error) => {
        console.error('❌ SSE Error:', error);
        statusDot.classList.add('disconnected');
        statusText.textContent = 'SSE Disconnected';

        if (updateCheckInterval) {
          clearInterval(updateCheckInterval);
          updateCheckInterval = null;
        }

        eventSource.close();

        // Попытка переподключения
        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
          statusText.textContent = `Reconnecting in ${delay/1000}s...`;
          setTimeout(connectSSE, delay);
        } else {
          statusText.textContent = 'Connection failed';
        }
      };
    }

    function updateDisplay(data) {
      const { headers, rows, timestamp } = data;

      // Обновляем статус
      document.getElementById('lastUpdate').textContent = new Date(timestamp).toLocaleTimeString();
      document.getElementById('symbolCount').textContent = rows.length;

      // Обновляем карточки
      const container = document.getElementById('cardsContainer');

      if (rows.length === 0) {
        container.innerHTML = '<div class="no-data">📭 No data available</div>';
        return;
      }

      container.innerHTML = rows.map((row, index) => {
        const openPrice = parseFloat(row.Open_price);
        const closePrice = parseFloat(row.Close_price);
        const priceChange = closePrice - openPrice;
        const priceChangeClass = priceChange >= 0 ? 'up' : 'down';
        const priceChangeSymbol = priceChange >= 0 ? '▲' : '▼';

        // Определяем символ (можно добавить в CSV или вычислить)
        const symbol = index === 0 ? 'XRPUSDT' : 'BTCUSDT';

        return `
          <div class="card">
            <div class="card-header">
              <div class="symbol">
                <span>${symbol}</span>
                <span class="timeframe">1m</span>
              </div>
              <div class="timestamp">${new Date(row.Open_time).toLocaleTimeString()}</div>
            </div>

            <div class="price-grid">
              <div class="price-item">
                <div class="price-label">Open</div>
                <div class="price-value">${parseFloat(row.Open_price).toFixed(4)}</div>
              </div>

              <div class="price-item">
                <div class="price-label">Close</div>
                <div class="price-value ${priceChangeClass}">
                  ${parseFloat(row.Close_price).toFixed(4)}
                  <span style="font-size: 12px; margin-left: 5px;">${priceChangeSymbol}</span>
                </div>
              </div>

              <div class="price-item">
                <div class="price-label">High</div>
                <div class="price-value">${parseFloat(row.High_price).toFixed(4)}</div>
              </div>

              <div class="price-item">
                <div class="price-label">Low</div>
                <div class="price-value">${parseFloat(row.Low_price).toFixed(4)}</div>
              </div>
            </div>

            <div class="volume">
              <div class="volume-label">Volume</div>
              <div class="volume-value">${parseFloat(row.Volume).toLocaleString()}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Запуск подключения при загрузке страницы
    connectSSE();

    // Переподключение при потере соединения
    window.addEventListener('beforeunload', () => {
      if (eventSource) {
        eventSource.close();
      }
    });
  </script>
</body>
</html>
