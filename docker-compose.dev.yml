name: piehook

services:
  redis:
    container_name: PieHook-Redis
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: PieHook-Frontend
    build:
      context: .
      dockerfile: CORE/3_Frontend/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./CORE/1_Redis:/app/CORE/1_Redis
      - ./CORE/3_Frontend:/app/CORE/3_Frontend
      - ./CORE/4_Data:/app/CORE/4_Data
      - ./settings.yaml:/app/settings.yaml:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAX_CONNECTIONS_PER_5MIN=140
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# сеть для взаимодействия между контейнерами
networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
